<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dragon study · Gate B</title><style>body{margin:0;background:#223634;color:#f3ead4;font:14px system-ui}canvas{display:block;width:100vw;height:100vh}header{position:absolute;top:16px;left:16px;max-width:28rem;background:#152e2bdd;padding:12px;border:1px solid #c5ae79;border-radius:5px}h1{font-size:18px;margin:0 0 4px}p{margin:4px 0 10px}button{background:#e7dbbd;color:#1c3932;border:0;padding:7px;margin:2px;border-radius:3px}#stats{font-size:12px}</style></head><body><header><h1>Dragon study · Gate B</h1><p>Isolated GLB inspection. Animation studies, not gameplay.</p><div id="buttons"></div><p id="stats">Loading model…</p></header><canvas aria-label="Isolated dragon model viewer"></canvas><script type="module">
import * as T from '../../assets/js/vendor/three-atlas.module.js?v=16';
const canvas=document.querySelector('canvas'),renderer=new T.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.35));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=.96;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();scene.background=new T.Color('#bacac2');const camera=new T.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);camera.position.set(11,6.5,13);camera.lookAt(0,1.5,-.4);scene.add(new T.HemisphereLight(0xe8f1e1,0x77644e,2));const key=new T.DirectionalLight(0xffe9cc,2);key.position.set(5,10,8);key.castShadow=true;key.shadow.mapSize.set(1024,1024);scene.add(key);
const loader=new T.GLTFLoader();let mixer,last=0,chosen='';const stats=document.querySelector('#stats');try{const asset=await loader.loadAsync('./dragon-batched.glb');scene.add(asset.scene);mixer=new T.AnimationMixer(asset.scene);let current;for(const clip of asset.animations){const b=document.createElement('button');b.textContent=clip.name;b.onclick=()=>{current?.stop();current=mixer.clipAction(clip);current.reset().play();chosen=clip.name;};document.querySelector('#buttons').append(b);}document.querySelector('button')?.click();let mesh=0;asset.scene.traverse(o=>{if(o.isMesh){mesh++;o.castShadow=true;}});document.body.dataset.asset=JSON.stringify({meshes:mesh,animations:asset.animations.map(a=>a.name)});}catch(error){stats.textContent='Could not load GLB: '+error.message;document.body.dataset.error=error.message;}
function frame(t){const dt=last?Math.min(.05,(t-last)/1000):0;last=t;mixer?.update(dt);renderer.render(scene,camera);stats.textContent=chosen+' · '+renderer.info.render.calls+' draw calls · '+renderer.info.render.triangles+' triangles';document.body.dataset.frame=JSON.stringify({animation:chosen,calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,memory:renderer.info.memory});requestAnimationFrame(frame)}requestAnimationFrame(frame);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
